name: Keep backend awake

# Pings the backend's /ping endpoint so a free-tier host (e.g. Render) does not
# spin the service down after a period of inactivity.
#
# Setup: in this repo go to Settings > Secrets and variables > Actions > Variables
# and add BACKEND_URL, e.g. https://your-service.onrender.com (no trailing slash).

on:
  schedule:
    # Every 10 minutes (Render free instances sleep after ~15 minutes idle).
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL variable is not set; nothing to ping."
            exit 0
          fi
          # A sleeping instance can take about a minute to cold start, so allow
          # a long timeout and a few retries.
          curl --fail --silent --show-error \
            --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            "${BACKEND_URL%/}/ping"
          echo
